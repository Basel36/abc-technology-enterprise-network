! HQ-Primary (snippet) - router-on-a-stick + HSRP + DHCP relay + OSPF
hostname HQ-Primary
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
service password-encryption
aaa new-model
aaa authentication login default local
aaa authentication login CON-AUTH line
aaa authentication login VTY-AUTH group radius local
radius-server host 192.168.30.11 key <RADIUS_KEY>
ip domain-name company.local
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
!
interface GigabitEthernet0/0
 no ip address
 no shutdown
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 192.168.2.130 255.255.255.192
 ip helper-address 192.168.30.10
 standby 10 ip 192.168.2.129
 standby 10 priority 110
 standby 10 preempt
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 192.168.2.194 255.255.255.192
 ip helper-address 192.168.30.10
 standby 20 ip 192.168.2.193
 standby 20 priority 100
 standby 20 preempt
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 192.168.0.2 255.255.254.0
 ip helper-address 192.168.30.10
 standby 30 ip 192.168.0.1
 standby 30 priority 110
 standby 30 preempt
! VLANs 40 (.3.2/27), 50 (.2.2/25), 60 (.3.34/27), 99 native (.3.66/28) follow the same pattern
!
router ospf 1
 router-id 1.1.1.1
 network 192.168.0.0 0.0.255.255 area 0
 passive-interface default
 no passive-interface Serial0/1/1
 no passive-interface Serial0/1/0
 no passive-interface Serial0/0/0
 no passive-interface Serial0/0/1
!
line console 0
 password <LINE_PASSWORD>
 login authentication CON-AUTH
line vty 0 15
 login authentication VTY-AUTH
 transport input ssh
