! DATACENTER (snippet) - server gateway, static NAT, default route
hostname DATACENTER
interface GigabitEthernet0/0.300
 encapsulation dot1Q 300
 ip address 192.168.30.1 255.255.255.224
 ip nat inside
interface GigabitEthernet0/2
 ip address 200.1.1.1 255.255.255.252
 ip nat outside
ip nat inside source static 192.168.30.12 50.50.50.2
ip route 0.0.0.0 0.0.0.0 200.1.1.2
router ospf 1
 router-id 5.5.5.5
 network 192.168.0.0 0.0.255.255 area 0
 passive-interface default
 no passive-interface Serial0/1/1
 no passive-interface Serial0/1/0
 no passive-interface Serial0/0/0
 no passive-interface Serial0/0/1
 default-information originate
